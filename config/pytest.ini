[pytest]
python_files =
  test_*.py
addopts =
  --cov
  --cov-config config/coverage.ini
  -m "not integration"
markers =
  integration: exercises deployed AWS resources (needs credentials, costs money)
testpaths =
  tests

# action:message_regex:warning_class:module_regex:line
filterwarnings =
  error
  default::EncodingWarning
  error::EncodingWarning:contact_center
  # TODO: remove once pytest-xdist 4 is released
  ignore:.*rsyncdir:DeprecationWarning:xdist
